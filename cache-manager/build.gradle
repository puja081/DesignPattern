plugins {
    id 'java'
    id 'application'
}

group = 'com.design'
version = '1.0-SNAPSHOT'
description = 'In-Memory Cache Manager with LRU Eviction and REST API'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
}

application {
    mainClass = 'com.design.cache.Main'
}
