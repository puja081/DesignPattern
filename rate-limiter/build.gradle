plugins {
    id 'java'
    id 'application'
}

group = 'com.design'
version = '1.0-SNAPSHOT'
description = 'Rate Limiter — Multiple Algorithms with REST API'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
}

application {
    mainClass = 'com.design.ratelimiter.Main'
}
